name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12", 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          NODE_OPTIONS: ${{ matrix.node == '22.12' && '--experimental-strip-types' || '' }}
      - run: npm run build
      - name: Run the examples against the fixture server
        run: npm run examples
        env:
          NODE_OPTIONS: ${{ matrix.node == '22.12' && '--experimental-strip-types' || '' }}
      - name: Require the ESM build from CommonJS
        run: node -e 'require("./dist/index.js")'
      - run: npm pack --dry-run
      - name: Check the packed types with attw
        run: npm run check:types
